<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IV Monitoring System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <h2 class="text-center mb-4">IV Monitoring System</h2>
    <div class="row">
        <div class="col-md-6">
            <h4>Staff Login</h4>
            <form method="POST" action="/staff_login">
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text" class="form-control" name="username" required>
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>
                <button class="btn btn-primary">Login</button>
            </form>
        </div>
        <div class="col-md-6">
            <h4>Patient Login</h4>
            <form method="POST" action="/patient_login">
                <div class="mb-3">
                    <label>Patient ID</label>
                    <input type="text" class="form-control" name="patient_id" required>
                </div>
                <button class="btn btn-success">Login</button>
            </form>
        </div>
    </div>
    {% if error %}
        <div class="alert alert-danger mt-3">{{ error }}</div>
    {% endif %}
</div>
</body>
</html>
